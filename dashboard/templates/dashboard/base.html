<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Philia{% endblock %}</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --navy: #10233f;
    --navy-light: #1a3459;
    --accent: #c9a15a;
    --green: #2f9e6e;
    --red: #c0392b;
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #232a35;
    --muted: #6b7684;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header .brand { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  header .brand span { color: var(--accent); }
  header .tagline { color: #9fb0c7; font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 22px;
  }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 14px; color: var(--navy); text-transform: uppercase; letter-spacing: 0.6px; }
  .subtitle { color: var(--muted); margin-bottom: 22px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .pill.LOW { background: #e4f5ec; color: var(--green); }
  .pill.MEDIUM { background: #fdf1de; color: #b3781c; }
  .pill.HIGH { background: #fbe5e2; color: var(--red); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .stat { text-align: center; }
  .stat .value { font-size: 28px; font-weight: 700; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
  a { color: var(--navy-light); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .project-list a.project-card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 12px;
    color: var(--text);
  }
  .project-list a.project-card:hover { border-color: var(--accent); text-decoration: none; }
  .status-badge {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">Philia<span>.</span></div>
  <div class="tagline">Film Accounting &amp; Investment Analytics</div>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
